<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrostBanner standalone example</title>
<script>
  window.frostBannerConfig = {
    template: 'aurora',
    lang: 'en',
    categories: ['necessary', 'analytics', 'marketing'],
    policyUrl: '#',
    remote: false
  };
</script>
<script src="../dist/fb.min.js"></script>

<!-- Runs only after "analytics" is accepted -->
<script type="text/plain" data-category="analytics">
  console.log('Analytics would load now');
</script>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px">
  <h1>FrostBanner example</h1>
  <p>Open this file in a browser. The banner appears; nothing is sent anywhere.</p>

  <h2>Video (blocked until marketing is accepted)</h2>
  <iframe width="560" height="315" data-category="marketing"
          data-src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ" title="Example video" allowfullscreen
          style="max-width: 100%; border: 0"></iframe>

  <p><a href="#" onclick="FrostBanner.open(); return false;">Cookie settings</a> ·
     <a href="#" onclick="FrostBanner.reset(); return false;">Reset choice</a></p>

  <script>
    FrostBanner.on('change', function (e) { console.log('consent', e.choices, e.source); });
  </script>
</body>
</html>
